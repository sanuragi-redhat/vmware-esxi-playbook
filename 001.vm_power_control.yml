- name: Control power state of a VM
  hosts: localhost
  gather_facts: false
  connection: local
  collections:
    - community.vmware
  vars:
    vcenter_hostname: "192.168.0.253"
    vcenter_username: "root"
    vcenter_password: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          35353661323130346132636134623035613136323162636438313232353137343931313665383131
          6130303134643436386635616463623062353130353261300a393033383335383264363139616432
          36643639353233356664326435366239633434373732316536336364636362313133343330346235
          3032623833306465340a343331303830366438363262613137313063626562383565343931633234
          6635
    datacenter_name: "Datacenter"
    vm_name: "windows-server-2025"
    desired_state: "powered-on"

  tasks:

    - name: Power state management of a VM
      vmware_guest_powerstate:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: no
        datacenter: "{{ datacenter_name }}"
        name: "{{ vm_name }}"
        state: "{{ desired_state }}"
        state_change_timeout: 120
      delegate_to: localhost
      register: result
       
    - name: Show VM name and power state
      debug:
        msg: "VM '{{ result.instance.hw_name }}' is currently '{{ result.instance.hw_power_status }}'"


