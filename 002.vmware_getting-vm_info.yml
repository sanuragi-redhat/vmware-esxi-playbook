- name: Collect VM Information from vSphere
  hosts: localhost
  gather_facts: no
  collections:
    - community.vmware

  vars:
    esxi_host: "192.168.0.253"
    esxi_user: "root"
    esxi_password: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          34623433306233623763353561316362313965393133336131386133653564373830373339313738
          3166346262333262666130623035336163343366316530630a643265393338666431623265303735
          38643435366662316662653361656364666561373636346531636235363539643237343436316136
          3038356538336131310a313931313961633338356139316366643630353664336138313632393466
          6366

  tasks:
    - name: Gather list of VMs
      community.vmware.vmware_vm_info:
        hostname: "{{ esxi_host }}"
        username: "{{ esxi_user }}"
        password: "{{ esxi_password }}"
        validate_certs: no
      register: vm_info

    - name: Generate VM Information Table
      set_fact:
        vm_table: |
          +---------------------------+-------------------------------+--------------+-----------+----------------------+
          | VM Name                  | OS Guest                      | Power State  | Datastore | MAC Address          |
          +---------------------------+-------------------------------+--------------+-----------+----------------------+
          {% for vm in vm_info.virtual_machines %}
          | {{ "%-25s" | format(vm.guest_name | default("N/A")) }} | {{ "%-29s" | format(vm.guest_fullname | default("N/A")) }} | {{ "%-12s" | format(vm.power_state | default("N/A")) }} | {{ "%-9s" | format(vm.datastore_url[0].name | default("N/A")) }} | {{ "%-20s" | format(vm.mac_address[0] | default("N/A")) }} |
          {% endfor %}
          +---------------------------+-------------------------------+--------------+-----------+----------------------+

    - name: Show VM Information in Table Format
      debug:
        msg: "{{ vm_table }}"

    - name: Save VM Info Table to file
      copy:
        dest: "./vmware_vm_report.txt"
        content: "{{ vm_table }}"
